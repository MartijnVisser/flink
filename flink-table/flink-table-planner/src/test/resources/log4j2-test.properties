# Set root logger level to OFF to not flood build logs
# set manually to INFO for debugging purposes
rootLogger.level = OFF
rootLogger.appenderRef.test.ref = TestLogger

appender.testlogger.name = TestLogger
appender.testlogger.type = CONSOLE
appender.testlogger.target = SYSTEM_ERR
appender.testlogger.layout.type = PatternLayout
appender.testlogger.layout.pattern = %-4r [%t] %-5p %c %x - %m%n

# Uncomment to enable codegen logging
#loggers = testlogger
#logger.testlogger.name =org.apache.flink.table.planner.codegen
#logger.testlogger.level = TRACE
#logger.testlogger.appenderRefs = TestLogger

# FLINK-39481 REPRO ONLY: diagnostic trace of UC channel-state recovery + window restore,
# plus checkpoint/restore INFO lines needed by the timing-signature analysis
loggers = f39481, ckcoord, execgraph
logger.f39481.name = org.apache.flink.FLINK39481
logger.f39481.level = DEBUG
logger.f39481.appenderRef.test.ref = TestLogger
logger.ckcoord.name = org.apache.flink.runtime.checkpoint.CheckpointCoordinator
logger.ckcoord.level = INFO
logger.ckcoord.appenderRef.test.ref = TestLogger
logger.execgraph.name = org.apache.flink.runtime.executiongraph.ExecutionGraph
logger.execgraph.level = INFO
logger.execgraph.appenderRef.test.ref = TestLogger
